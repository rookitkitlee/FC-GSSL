device: 0

# # Dataset settings
num_atom_type: 119
batch_size: 65
num_workers: 0
pooling: sum

# # Training settings
# epochs: 60
epochs: 40
optim: adam
# init_lr: 0.0002
init_lr: 0.00002
weight_decay: 0.0
schedule_opt: none

# # Pretraining settings
# mask_ratio: 0.5
mask_ratio: 0.5
edge_drop: 0.25
masked_atom_loss: 1.0
masked_pe_loss: 0.01
# masked_ssl_loss: 0.0001
masked_ssl_loss: 0.01
ssl_sample: 256
ssl_temp: 0.2
atom_recon_type: sce
alpha_l: 1.0
noise_val: 0.001

# # Encoder & Decoder setting
enc_gnn_layer: 2
embed_dim: 300
gnn_dropout: 0.5
gnn_edge_dropout: 0.5
gnn_activation: relu
task_head_activation: gelu

# # Positional Encoding (PE) settings
max_freqs: 15
lap_norm: sym
eigvec_norm: L2
pos_activation: gelu
